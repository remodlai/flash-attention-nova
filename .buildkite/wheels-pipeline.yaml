      - "modal token set --token-id \"$${MODAL_TOKEN_ID}\" --token-secret \"$${MODAL_TOKEN_SECRET}\" --profile=remodlai"
      - "DOCKER_BUILDKIT=1 docker build --build-arg MAX_JOBS=32 --build-arg NVCC_THREADS=16 --build-arg CUDA_VERSION=12.9 --build-arg TORCH_CUDA_ARCH_LIST='8.0 8.6 8.9 9.0 9.0a' --tag flash-attn-ci:build-image --progress plain -f Dockerfile ."
